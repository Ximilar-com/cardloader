name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 (Visual Studio 2022): on the Visual Studio 18 image, MSBuild fails llama.cpp's Vulkan shader
        # generator step ("cannot find the batch label specified - VCEnd").
        os: [ubuntu-22.04, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      # Windows and Linux build llama.cpp's Vulkan backend, as releases do (macOS has Metal built in).
      CARGO_FEATURES: ${{ matrix.os != 'macos-latest' && '--features cardloader/vulkan' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev cmake clang

      - name: Vulkan SDK
        if: runner.os != 'macOS'
        uses: ./.github/actions/vulkan-sdk

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installs the toolchain pinned in rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: TWAIN sidecar (Windows)
        if: runner.os == 'Windows'
        run: node scripts/prepare-sidecar.mjs

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets ${{ env.CARGO_FEATURES }} -- -D warnings
      - run: cargo test --workspace ${{ env.CARGO_FEATURES }}

      - name: Clippy the 32-bit TWAIN sidecar
        if: runner.os == 'Windows'
        run: cargo clippy -p cardloader-twain --target i686-pc-windows-msvc -- -D warnings
