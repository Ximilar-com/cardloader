name: Release

# Push a tag like v0.1.0 to build installers for macOS, Windows and Linux into a draft GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin
          # Local models on the GPU through llama.cpp's Vulkan backend (macOS has Metal built in).
          - name: Windows x64
            os: windows-latest
            args: --features vulkan
          - name: Linux x64
            os: ubuntu-22.04
            args: --features vulkan
    runs-on: ${{ matrix.os }}
    env:
      # Signing is optional: these only take effect once the repository secrets exist.
      SECRET_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      SECRET_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      SECRET_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev cmake clang

      - name: Vulkan SDK
        if: runner.os != 'macOS'
        uses: ./.github/actions/vulkan-sdk

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          target: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: TWAIN sidecar (Windows)
        if: runner.os == 'Windows'
        run: node scripts/prepare-sidecar.mjs

      # macOS signing + notarization (https://v2.tauri.app/distribute/sign/macos/).
      - name: Apple signing environment
        if: runner.os == 'macOS' && env.SECRET_APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      # Windows Authenticode: a base64 .pfx in WINDOWS_CERTIFICATE (+ WINDOWS_CERTIFICATE_PASSWORD).
      - name: Windows signing certificate
        if: runner.os == 'Windows' && env.SECRET_WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE }}"))
          $password = ConvertTo-SecureString -String "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $conf = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } } | ConvertTo-Json -Depth 5
          Set-Content -Path src-tauri/tauri.signing.conf.json -Value $conf
          "TAURI_SIGN_ARGS=--config src-tauri/tauri.signing.conf.json" | Out-File -FilePath $env:GITHUB_ENV -Append

      # In-app updates (https://v2.tauri.app/plugin/updater/): bundles signed with the key whose public half is in
      # tauri.conf.json, and a latest.json the app reads from the latest published release.
      - name: Updater artifacts
        if: env.SECRET_UPDATER_KEY != ''
        shell: bash
        run: |
          echo '{"bundle":{"createUpdaterArtifacts":true}}' > src-tauri/tauri.updater.conf.json
          echo "TAURI_UPDATER_ARGS=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Cardloader ${{ github.ref_name }}
          releaseBody: See the assets below to download and install Cardloader for your platform.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ env.TAURI_SIGN_ARGS }} ${{ env.TAURI_UPDATER_ARGS }}

      # Tauri says only "failed to run linuxdeploy" when the AppImage fails: this runs it again on the folder Tauri
      # prepared and shows what it said, and which shipped libraries don't find what they need.
      - name: Why the AppImage failed
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: |
          appdir=$(find target/release/bundle/appimage -maxdepth 1 -name "*.AppDir" | head -1)
          echo "AppDir: $appdir"
          for f in "$appdir"/usr/bin/* "$appdir"/usr/lib/Cardloader/llama/*; do
            missing=$(ldd "$f" 2>&1 | grep -i "not found" || true)
            [ -n "$missing" ] && printf '%s\n%s\n' "$f" "$missing"
          done
          tool=$(find "$HOME/.cache/tauri" -name "linuxdeploy-x86_64.AppImage" | head -1)
          OUTPUT="$RUNNER_TEMP/test.AppImage" ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 "$tool" \
            --appimage-extract-and-run --verbosity 1 --appdir "$appdir" --plugin gtk --output appimage 2>&1 | tail -120

      # A manual run without a tag creates no release: its installers are kept as workflow artifacts, to try a build
      # (such as one from a branch) before tagging. Windows builds into CARGO_TARGET_DIR (see the Vulkan SDK action),
      # and one upload takes files under one root only.
      - name: Installers as artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch' && env.CARGO_TARGET_DIR == ''
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            target/release/bundle/
            target/universal-apple-darwin/release/bundle/
          if-no-files-found: error
          retention-days: 7

      - name: Installers as artifacts (manual runs, own target folder)
        if: github.event_name == 'workflow_dispatch' && env.CARGO_TARGET_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: ${{ env.CARGO_TARGET_DIR }}/release/bundle/
          if-no-files-found: error
          retention-days: 7
