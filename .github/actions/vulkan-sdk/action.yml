name: Vulkan SDK
description: >-
  Installs LunarG's Vulkan SDK on Windows and Linux runners: the headers, glslc and SPIRV-Headers that llama.cpp's
  Vulkan backend (the `vulkan` cargo feature) builds with. On Windows it also makes CMake build with Ninja and
  gives cargo a short target folder (CARGO_TARGET_DIR), both of which that build needs there. The built app needs
  none of it; it uses the GPU driver's Vulkan loader when there is one.
inputs:
  version:
    description: LunarG Vulkan SDK version
    default: "1.4.313.0"
runs:
  using: composite
  steps:
    - name: Vulkan SDK (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $v = "${{ inputs.version }}"
        $installer = Join-Path $env:RUNNER_TEMP "vulkan-sdk.exe"
        curl.exe -fsSL -o $installer "https://sdk.lunarg.com/sdk/download/$v/windows/vulkansdk-windows-X64-$v.exe"
        & $installer --root "C:\VulkanSDK\$v" --accept-licenses --default-answer --confirm-command install
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "VULKAN_SDK=C:\VulkanSDK\$v" | Out-File -FilePath $env:GITHUB_ENV -Append
        "C:\VulkanSDK\$v\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
        # llama.cpp builds its Vulkan shader generator as a CMake ExternalProject. Under the Visual Studio generator
        # MSBuild ran that project's steps out of order (install before configure: "Not a file: …cmake_install.cmake",
        # "cannot find the batch label specified - VCEnd"), with Visual Studio 2022 and 18 alike. Ninja runs them in
        # order; the cmake crate hands it the MSVC environment.
        choco install ninja --no-progress -y
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append
        # That project's build folder is nested deep inside cargo's: under <workspace>\target its paths pass CMake's
        # 250 characters and its compiler check fails (rc.exe on a manifest it can't reach). A target folder at the
        # drive's root keeps them short.
        $target = Join-Path (Split-Path -Qualifier $env:GITHUB_WORKSPACE) "t"
        "CARGO_TARGET_DIR=$target" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Vulkan SDK (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        v="${{ inputs.version }}"
        curl -fsSL -o "$RUNNER_TEMP/vulkan-sdk.tar.xz" "https://sdk.lunarg.com/sdk/download/$v/linux/vulkansdk-linux-x86_64-$v.tar.xz"
        mkdir -p "$RUNNER_TEMP/vulkan-sdk"
        tar -xJf "$RUNNER_TEMP/vulkan-sdk.tar.xz" -C "$RUNNER_TEMP/vulkan-sdk"
        sdk="$RUNNER_TEMP/vulkan-sdk/$v/x86_64"
        echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
        echo "$sdk/bin" >> "$GITHUB_PATH"
        echo "LD_LIBRARY_PATH=$sdk/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
